name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest erp_demo/test_app.py tests -q
      - run: node workflows/check-policy.cjs
      - run: node --check web/assets/app.js
      - run: node --check deploy/bootstrap.mjs
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build api web
      - name: Check gateway and private route boundary
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8088/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8088/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8088/internal/erp/catalog)" = "404"
      - if: always()
        run: docker compose down
