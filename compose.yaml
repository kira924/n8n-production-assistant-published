name: production-desk

services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      DEMO_DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:?Run python scripts/setup.py first}
      REVIEWER_SECRET: ${REVIEWER_SECRET:?Run python scripts/setup.py first}
      SESSION_SECRET: ${SESSION_SECRET:?Run python scripts/setup.py first}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/production-plan
    volumes:
      - demo_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5688:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run python scripts/setup.py first}
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:?Run python scripts/setup.py first}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      GENERIC_TIMEZONE: Africa/Cairo
      TZ: Africa/Cairo
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/files/workflows:ro
      - ./deploy/bootstrap.mjs:/files/bootstrap.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:8088:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app]

networks:
  app:

volumes:
  demo_data:
  n8n_data:
